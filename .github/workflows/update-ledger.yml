name: Update ledger

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-ledger
  cancel-in-progress: false

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Mask configured Easee secrets
        shell: bash
        env:
          EASEE_USERNAME: ${{ secrets.EASEE_USERNAME }}
          EASEE_PASSWORD: ${{ secrets.EASEE_PASSWORD }}
          EASEE_TOKEN: ${{ secrets.EASEE_TOKEN }}
        run: |
          for value in "$EASEE_USERNAME" "$EASEE_PASSWORD" "$EASEE_TOKEN"; do
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi
          done

      - name: Update ledger
        env:
          EASEE_USERNAME: ${{ secrets.EASEE_USERNAME }}
          EASEE_PASSWORD: ${{ secrets.EASEE_PASSWORD }}
          EASEE_TOKEN: ${{ secrets.EASEE_TOKEN }}
        run: npm run update-ledger

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- docs/data/ledger.json; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add docs/data/ledger.json
          git commit -m "Update ledger site"
          git push origin HEAD:main
